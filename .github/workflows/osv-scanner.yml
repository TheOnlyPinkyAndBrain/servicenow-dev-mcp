# Single OSV-Scanner workflow for the whole project.
# Runs on PRs, pushes to main, the merge queue, and weekly. Using one workflow
# file means one code-scanning category on both main and PRs, so GitHub can
# diff PR alerts against main (no "cannot determine alerts introduced" warning).
name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
