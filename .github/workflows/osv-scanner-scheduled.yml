# Full OSV scan. Also runs on pull_request so this workflow's code-scanning
# category is present on PRs, letting GitHub diff PR alerts against main
# (avoids "Code scanning cannot determine the alerts introduced by this PR").
# The differential PR-only scan lives in osv-scanner-pr.yml.
name: OSV-Scanner Full Scan

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
